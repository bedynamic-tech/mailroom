<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-theme="light" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" data-theme="dark" />
    <meta name="description" content="A shared email workspace for people and agents." />
    <meta name="application-name" content="Mailroom +" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mailroom +" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Cloudflare Access protects every path, so the manifest must be fetched
         with the Access session cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/brand/mailroom.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=2" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <title>Mailroom +</title>
    <script>
      // Apply the saved theme before the first paint (see src/web/theme.ts).
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("mailroom.theme");
        } catch (error) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
